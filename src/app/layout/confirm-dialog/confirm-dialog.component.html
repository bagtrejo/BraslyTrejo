<div class="dialog__overlay">
  <div class="dialog__content">
    <h2 class="dialog__title">{{ title() }}</h2>
    <p class="dialog__message">{{ message() }}</p>

    <hr class="dialog__divider">
   
    <div class="dialog__actions">
      <button class="dialog__button dialog__button--cancel" type="button" (click)="onCancel()">Cancelar</button>
      <button class="dialog__button dialog__button--confirm" type="button" (click)="onConfirm()">Confirmar</button>
    </div>
  </div>
</div>
